<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" width="100%" height="100%">
  <defs>
    <linearGradient id="finGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Logo Icon: Faceted Stone / Rising Trend -->
  <g transform="translate(25, 20)">
    <!-- Base Facet (Stone Foundation) -->
    <path d="M 20,95 L 50,105 L 80,85 L 50,65 Z" fill="#1E293B" />
    <!-- Middle Facet -->
    <path d="M 50,65 L 80,85 L 85,45 L 50,35 Z" fill="#334155" />
    <!-- Growth Arrow / Apex Point -->
    <path d="M 50,35 L 85,45 L 95,10 L 55,20 Z" fill="url(#accentGrad)" />
    <!-- 'i' Dot Accent (Trading Signal Node) -->
    <circle cx="75" cy="12" r="6" fill="#10B981" />
  </g>

  <!-- Typography -->
  <text x="145" y="82" font-family="&#39;Montserrat&#39;, &#39;Segoe UI&#39;, sans-serif" font-size="38" font-weight="300" fill="#0F172A">i<tspan font-weight="900" fill="#0F172A">SOFTSTONE</tspan></text>
  <text x="147" y="106" font-family="&#39;Montserrat&#39;, &#39;Segoe UI&#39;, sans-serif" font-size="11" font-weight="700" letter-spacing="6" fill="#10B981">PROPRIETARY TRADING</text>
</svg>